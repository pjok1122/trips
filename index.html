<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 기록 — Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-mist:#EAF2F0;
    --sea-deep:#1E3742;
    --sea-mid:#3E7C8A;
    --torii:#CE4A2A;
    --sand:#C7A45C;
    --paper:#FBFDFC;
    --line:#C9D8D5;
    --dim:#7A9199;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:var(--sea-mist);
    color:var(--sea-deep);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}

  header{padding:64px 0 12px;text-align:center}
  .eyebrow{
    font-size:12px;letter-spacing:.35em;color:var(--sea-mid);
    text-transform:uppercase;margin-bottom:14px;
  }
  h1{
    font-family:'Gowun Batang',serif;font-weight:700;
    font-size:clamp(28px,5vw,42px);line-height:1.3;
  }
  h1 .accent{color:var(--torii)}
  .subtitle{color:var(--dim);margin-top:14px;font-size:15px}

  .divider{
    width:56px;height:2px;background:var(--sand);
    margin:36px auto 40px;border-radius:2px;
  }

  .trips{display:grid;gap:18px}

  .trip{
    display:block;text-decoration:none;color:inherit;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 28px;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .trip:hover{
    transform:translateY(-2px);
    border-color:var(--sea-mid);
    box-shadow:0 8px 24px rgba(30,55,66,.10);
  }
  .trip-meta{
    font-size:12px;letter-spacing:.2em;color:var(--sea-mid);
    text-transform:uppercase;margin-bottom:10px;
  }
  .trip-title{
    font-family:'Gowun Batang',serif;font-weight:700;
    font-size:22px;line-height:1.4;margin-bottom:8px;
  }
  .trip-route{color:var(--dim);font-size:14px}
  .trip-dates{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--sea-mid);
  }

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 28px;text-align:center;color:var(--dim);font-size:14px;
  }

  footer{
    margin-top:56px;text-align:center;
    font-size:12px;color:var(--dim);letter-spacing:.05em;
  }
  footer a{color:var(--sea-mid)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Trips</div>
    <h1>어디론가, <span class="accent">천천히</span></h1>
    <p class="subtitle">직접 짠 여행 일정들을 모아둡니다.</p>
  </header>

  <div class="divider"></div>

  <!-- 여행 추가: 아래 <a class="trip"> 블록을 복사해 맨 위에 붙여넣으세요 -->
  <div class="trips">

    <a class="trip" href="./setouchi-2026/">
      <div class="trip-meta">Japan · 세토내해</div>
      <div class="trip-title">둘이서 세토내해, 천천히 서쪽으로</div>
      <div class="trip-route">오노미치 → 히로시마 → 미야지마 → 도고온천</div>
      <div class="trip-dates">7박 8일 · 2026. 9. 30(수) – 10. 7(수)</div>
    </a>

  </div>

  <footer>
    <a href="https://github.com/pjok1122/trips">github.com/pjok1122/trips</a>
  </footer>

</div>
</body>
</html>
